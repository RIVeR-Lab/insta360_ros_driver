# Key uses a wildcard so it matches the node in any namespace
# (the launch file puts it under /insta360).
/**/imu_filter:
  ros__parameters:
    stateless: false
    use_mag: false
    # false: insta_imu already has a parent (insta_sensor) in the static TF
    # tree, and a frame can only have one parent.
    publish_tf: false
    reverse_tf: false
    fixed_frame: "imu_stabilized"
    constant_dt: 0.0
    publish_debug_topics: false
    world_frame: "nwu"
    gain: 0.1
    zeta: 0.0
    mag_bias_x: 0.0
    mag_bias_y: 0.0
    mag_bias_z: 0.0
    orientation_stddev: 0.0